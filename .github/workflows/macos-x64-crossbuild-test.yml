name: macOS x64 crossbuild test

on:
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  crossbuild:
    name: Build macos-x86_64 via Rosetta
    runs-on: macos-15
    env:
      UV_PYTHON_PREFERENCE: only-system
    defaults:
      run:
        shell: "arch -x86_64 /bin/bash --noprofile --norc -eo pipefail {0}"
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up x64 Python (runs under Rosetta)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          architecture: x64

      - name: Confirm Python is running as x86_64 under Rosetta
        run: |
          which python3
          [ "$(python3 -c 'import platform; print(platform.machine())')" = "x86_64" ]

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install macOS build dependencies
        run: brew install ccache

      - name: Build
        run: ./scripts/build.sh

      - name: Confirm build output is x86_64
        run: |
          info="$(uv run python scripts/app-info)"
          eval "$info"
          lipo -archs "$EXEC_DIRECTORY/$NAME.app/Contents/MacOS/$NAME"

      # the app has no CLI flags and runs a normal Qt event loop, so this
      # launches it, gives it a moment to come up under Rosetta, then sends
      # SIGTERM (which it already handles for a clean shutdown) and checks
      # the exit code
      - name: Smoke test the built app under Rosetta
        run: |
          info="$(uv run python scripts/app-info)"
          eval "$info"
          QT_QPA_PLATFORM=offscreen "$EXEC_DIRECTORY/$NAME.app/Contents/MacOS/$NAME" &
          pid=$!
          sleep 3
          kill -TERM "$pid"
          wait "$pid"

      # target name is passed explicitly: uname -m on the (arm64) shell
      # process would misreport arch even though python/the build are x64
      - name: Package
        run: ./scripts/package.sh macos-x86_64

      - name: Upload artifact to workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-x86_64-crossbuild-test
          path: staging
          if-no-files-found: error
