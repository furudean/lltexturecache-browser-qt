name: Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: Read app metadata
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.info.outputs.name }}
      version: ${{ steps.info.outputs.version }}
      stable: ${{ steps.info.outputs.stable }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Read name and version from pyproject.toml
        id: info
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          info="$(python scripts/app-info)"
          eval "$info"

          echo "$NAME is version $VERSION"

          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

          # a tag with a suffix, v1.2.3-rc1, stays a pre-release
          case "$TAG" in
            *-*) stable=false ;;
            *) stable=true ;;
          esac

          {
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15
            target: macos-x86_64
            python_architecture: x64
            rosetta: true
          - os: windows-latest
            target: windows-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
    env:
      # build against the CPython from setup-python, not a uv managed one,
      # because Nuitka does not support python-build-standalone interpreters
      UV_PYTHON_PREFERENCE: only-system
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    defaults:
      run:
        shell: ${{ matrix.rosetta && 'arch -x86_64 /bin/bash --noprofile --norc -eo pipefail {0}' || 'bash' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          architecture: ${{ matrix.python_architecture }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Nuitka needs patchelf to fix up the rpaths of the bundled Qt libraries.
      # libxcb-cursor0 has to be present at build time for Nuitka to bundle it.
      # desktop-file-utils is used by appimagetool to validate the desktop file.
      # ccache is used to speed up builds
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ccache patchelf libxcb-cursor0 desktop-file-utils

      # ccache is used to speed up builds
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: brew install ccache

      # without this Nuitka falls back to a downloaded zig, which is slower
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "vswhere=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%vswhere%" -latest -products * -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          )

          if not defined WindowsSDKVersion (
            echo ::error::the Windows SDK is missing from the MSVC environment
            exit /b 1
          )

          set | findstr /v /b "=" >> "%GITHUB_ENV%"

      - name: Import signing certificate
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        run: ./scripts/macos-keychain.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Sign and notarize
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        run: ./scripts/macos-sign.sh

      - name: Package
        run: ./scripts/package.sh "${{ matrix.target }}"

      - name: Upload artifact to workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: staging
          if-no-files-found: error

  upload:
    name: Attach binaries to the release
    needs: [meta, build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload binaries
        run: |
          ls -l artifacts
          gh release upload "$TAG" artifacts/* --clobber

      # the release is published as a pre-release, promote it now that it has
      # binaries on it
      - name: Promote the release
        if: needs.meta.outputs.stable == 'true'
        run: gh release edit "$TAG" --prerelease=false --latest

  homebrew:
    name: Update homebrew tap
    needs: [meta, upload]
    if: github.event_name == 'release' && needs.meta.outputs.stable == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download the macOS builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          path: artifacts
          merge-multiple: true

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: furudean/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump cask version
        env:
          NAME: ${{ needs.meta.outputs.name }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          arm_asset="artifacts/$NAME-$VERSION-macos-arm64.zip"
          intel_asset="artifacts/$NAME-$VERSION-macos-x86_64.zip"
          arm_sha256="$(sha256sum "$arm_asset" | cut -d' ' -f1)"
          intel_sha256="$(sha256sum "$intel_asset" | cut -d' ' -f1)"
          cask="tap/Casks/$NAME.rb"

          echo "$arm_asset is $arm_sha256"
          echo "$intel_asset is $intel_sha256"

          sed -i -E "s|^  version \".*\"|  version \"$VERSION\"|" "$cask"
          sed -i -E "s|^(\s*sha256 arm:\s*)\".*\",|\1\"$arm_sha256\",|" "$cask"
          sed -i -E "s|^(\s*intel:\s*)\".*\"|\1\"$intel_sha256\"|" "$cask"

          if git -C tap diff --quiet; then
            echo "::notice::cask already up to date"
            exit 0
          fi

          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap commit --all --message "$NAME $VERSION"
          git -C tap push
