name: Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # build against the CPython from setup-python, not a uv managed one, because
  # Nuitka does not support python-build-standalone interpreters
  UV_PYTHON_PREFERENCE: only-system

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Read name and version from pyproject.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          read -r name version <<<"$(uv version)"
          echo "$name is version $version"

          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi

          echo "APP_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Nuitka needs patchelf to fix up the rpaths of the bundled Qt libraries.
      # libxcb-cursor0 has to be present at build time for Nuitka to bundle it.
      # ccache is used to speed up builds
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ccache patchelf libxcb-cursor0

      # ccache is used to speed up builds
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Import signing certificate
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          certificate="$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$certificate"

          # let codesign use the key without an interactive prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"

          # keep the login keychain searchable, the runner needs it elsewhere
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Build
        if: runner.os != 'Windows'
        run: ./scripts/build.sh

      # without this Nuitka falls back to a downloaded zig, which is slower
      - name: Build
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "vswhere=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%vswhere%" -latest -products * -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          )

          if not defined WindowsSDKVersion (
            echo ::error::the Windows SDK is missing from the MSVC environment
            exit /b 1
          )

          bash scripts/build.sh

      - name: Notarize
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != '' && env.APPLE_ID != ''
        run: |
          ditto -c -k --keepParent "dist/$APP_NAME.app" "$RUNNER_TEMP/notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          # so the app opens on a machine that is offline or behind a firewall
          xcrun stapler staple "dist/$APP_NAME.app"

      - name: Package
        id: package
        run: |
          asset="$APP_NAME-$VERSION-${{ matrix.target }}"

          case "$RUNNER_OS" in
            macOS)
              ditto -c -k --keepParent "dist/$APP_NAME.app" "$asset.zip"
              asset="$asset.zip"
              ;;
            Windows)
              mv "dist/$APP_NAME.exe" "$asset.exe"
              asset="$asset.exe"
              ;;
            Linux)
              mv "dist/$APP_NAME.bin" "$asset"
              chmod +x "$asset"
              ;;
          esac

          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

      - name: Clean up keychain
        if: always() && runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

  upload:
    name: Attach binaries to the release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l artifacts
          gh release upload "$TAG" artifacts/* --clobber

      # the release is published as a pre-release, promote it now that it has
      # binaries on it
      - name: Promote the release
        if: "!contains(github.event.release.tag_name, '-')"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG" --prerelease=false --latest

  homebrew:
    name: Update homebrew tap
    needs: upload
    if: github.event_name == 'release' && !contains(github.event.release.tag_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Download the macOS build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-arm64
          path: artifacts

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: furudean/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump the cask
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          asset="artifacts/lltexturecache-browser-qt-$version-macos-arm64.zip"
          sha256="$(sha256sum "$asset" | cut -d' ' -f1)"
          cask="tap/Casks/lltexturecache-browser-qt.rb"

          echo "$asset is $sha256"

          sed -i -E "s|^  version \".*\"|  version \"$version\"|" "$cask"
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"$sha256\"|" "$cask"

          if git -C tap diff --quiet; then
            echo "::notice::cask already up to date"
            exit 0
          fi

          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap commit --all --message "lltexturecache-browser-qt $version"
          git -C tap push
