[project]
name = "lltexturecache-browser-qt"
version = "0.6.0"
description = "a cross-platform tool to browse and export textures from the second life texture cache"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "imagecodecs>=2026.8.16",
    "pillow>=12.3.0",
    "pyside6>=6.11.2",
    "texture-courier>=0.0.16",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "nuitka>=4.1.3",
    "pytest>=8.4.2",
    "ruff>=0.16.3",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["setuptools", "wheel", "build"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lltexturecache_browser_qt*"]

[tool.setuptools.package-data]
lltexturecache_browser_qt = ["assets/*.png", "assets/licences/*.txt"]

[project.scripts]
lltexturecache-browser-qt = "lltexturecache_browser_qt.main:main"

[tool.app]
display-name = "lltexturecache-browser-qt"
bundle-id = "com.furudean.lltexturecache-browser-qt"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
exclude = ["build", "dist"]
strict = true

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.bandit]
# build output is a copy of the package, and dist is what was shipped from it,
# so scanning either only reports every finding a second time
exclude_dirs = ["build", "dist", ".venv", "tests"]
