[project]
name = "lltexturecache-browser-qt"
version = "0.1.0"
description = "A cross-platform user interface for the Second Life texture cache"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "imagecodecs>=2026.8.16",
    "pillow>=12.3.0",
    "pyside6>=6.11.2",
    "texture-courier>=0.0.12",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "nuitka>=4.1.3",
    "ruff>=0.16.3",
]

[build-system]
requires = ["setuptools", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project.scripts]
lltexturecache-browser-qt = "lltexturecache_browser_qt.main:main"

[tool.mypy]
python_version = "3.14"
exclude = ["build", "dist"]
strict = true

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.uv.sources]
texture-courier = { path = "../texture-courier", editable = true }
